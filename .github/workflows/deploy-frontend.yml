name: Deploy frontend to Cloudflare Pages

# Requires two repo secrets, set once by whoever owns the Cloudflare account
# (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - found on the Cloudflare dashboard's right sidebar
#
# Until those secrets exist this workflow will fail at the deploy step -
# that's expected, it doesn't block CI or PR merges (see ci.yml for the
# required checks). You can also skip this workflow entirely and just
# connect the client/ folder to Cloudflare Pages via its dashboard's git
# integration instead (Framework preset: Vite, build command: npm run
# build, build output directory: dist, root directory: client) - either
# approach works, this one just gives you a deploy log in GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm install
      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gigsync
          directory: client/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
