# Render Blueprint for the GigSync API (Express + Socket.IO + Postgres on Supabase).
# Frontend lives on Cloudflare; media lives on Cloudflare R2 - neither is here.
#
# Setup: Render dashboard > New > Blueprint > pick this repo. Render prompts
# for every variable marked `sync: false` (secrets are never stored in git).
# After the frontend URL exists, set CLIENT_ORIGIN to it (no trailing slash)
# so CORS and the cross-site auth cookies work.
services:
  - type: web
    name: gigsync-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # Only redeploy when the API actually changes (client-only pushes skip it).
    buildFilter:
      paths:
        - server/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # PORT is injected by Render - don't set it here.

      # --- must be filled in on first deploy ---
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false

      # --- auth ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # --- Cloudflare R2 media storage ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: gigsync-media
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ID_DOCUMENTS_BUCKET_NAME
        sync: false
